<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1270" viewBox="0 0 2000 1270" role="img" aria-labelledby="title desc">
  <title id="title">ACC32 Harvard microcoded processor RTL scheme</title>
  <desc id="desc">Separated RTL datapath and microprogrammed control unit for the ACC32 Harvard processor with hardwired memory-mapped input and output ports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <style>
      text { fill: #111111; font-family: Arial, Helvetica, sans-serif; }
      .section { fill: none; stroke: #111111; stroke-width: 1.8; stroke-dasharray: 9 7; }
      .block { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .section-title { font-size: 19px; font-weight: 700; }
      .block-title { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .block-sub { font-size: 13px; text-anchor: middle; }
      .small { font-size: 12px; text-anchor: middle; }
      .data { fill: none; stroke: #111111; stroke-width: 2; marker-end: url(#arrow); }
      .bus { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #111111; stroke-width: 2; }
      .control { fill: none; stroke: #111111; stroke-width: 1.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { font: 13px Consolas, "Courier New", monospace; }
      .signal { font: 13px Consolas, "Courier New", monospace; }
      .junction { fill: #111111; }
    </style>
  </defs>

  <rect width="2000" height="1270" fill="#ffffff"/>

  <rect x="10" y="10" width="1980" height="850" class="section"/>
  <text x="35" y="40" class="section-title">Data Path</text>

  <polygon points="50,90 150,90 190,140 150,190 50,190" class="block"/>
  <text x="115" y="132" class="block-title">PC MUX</text>
  <text x="115" y="155" class="block-sub">PC+1 / target</text>

  <rect x="240" y="105" width="140" height="70" class="block"/>
  <text x="310" y="133" class="block-title">PC</text>
  <text x="310" y="157" class="block-sub">program counter [31:0]</text>

  <rect x="240" y="220" width="140" height="55" class="block"/>
  <text x="310" y="244" class="block-title">PC + 1</text>
  <text x="310" y="264" class="block-sub">byte incrementer</text>

  <rect x="430" y="60" width="280" height="155" class="block"/>
  <text x="570" y="99" class="block-title">Instruction Memory</text>
  <text x="570" y="126" class="block-title">IMEM</text>
  <text x="570" y="153" class="block-sub">byte-addressed ROM</text>
  <text x="570" y="178" class="block-sub">ADDR[31:0] → DOUT[7:0]</text>

  <rect x="760" y="85" width="170" height="65" class="block"/>
  <text x="845" y="112" class="block-title">IR</text>
  <text x="845" y="135" class="block-sub">opcode [7:0]</text>

  <rect x="760" y="190" width="220" height="70" class="block"/>
  <text x="870" y="217" class="block-title">Operand Byte Packer</text>
  <text x="870" y="241" class="block-sub">write selected byte to OPR</text>

  <rect x="430" y="300" width="160" height="70" class="block"/>
  <text x="510" y="328" class="block-title">IPC</text>
  <text x="510" y="352" class="block-sub">instruction start [31:0]</text>

  <rect x="620" y="300" width="190" height="70" class="block"/>
  <text x="715" y="328" class="block-title">Relative EA Adder</text>
  <text x="715" y="352" class="block-sub">IPC + SEXT(OPR[15:0])</text>

