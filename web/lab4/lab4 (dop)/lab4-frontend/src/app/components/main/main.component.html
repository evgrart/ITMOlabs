<div class="main-wrapper">
    <div class="header">
        <h2 style="color: white; margin: 0;">СИСТЕМА НАВЕДЕНИЯ</h2>
        <p-button label="ПОКИНУТЬ ПОСТ" icon="pi pi-sign-out" (onClick)="logout()"></p-button>
    </div>

    <div class="content-container">
        <p-card styleClass="control-panel">
            <div class="form-grid">
                <div class="field">
                    <label>Координата X</label>
                    <p-listbox [options]="xOptions" [(ngModel)]="point.x" [style]="{'width':'100%'}"></p-listbox>
                </div>
                <div class="field">
                    <label>Радиус R</label>
                    <p-listbox [options]="rOptions" [(ngModel)]="point.r" [style]="{'width':'100%'}"></p-listbox>
                </div>
                <div class="field" style="grid-column: span 2;">
                    <label>Координата Y (-3 ... 3)</label>
                    <input type="text" pInputText [(ngModel)]="point.y" style="width: 100%; text-align: center;">
                </div>
                <div class="field" style="grid-column: span 2;">
                    <p-button label="ОГОНЬ" icon="pi pi-crosshairs" [style]="{'width':'100%'}" (onClick)="submitPoint()"></p-button>
                </div>
            </div>
        </p-card>

        <div class="graph-container">
            <app-graph 
                [r]="point.r" 
                [points]="history" 
                [highlightZone]="currentHighlightZone"
                (mapClick)="onMapClick($event)">
            </app-graph>
        </div>

        <div class="table-container">
            <p-table [value]="history" [scrollable]="true" scrollHeight="400px" styleClass="p-datatable-sm">
                <ng-template pTemplate="header">
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Инфо</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-p>
                    <tr [ngClass]="{'row-hit': p.hit, 'row-miss': !p.hit}">
                        <td>{{p.x | number:'1.0-2'}}</td>
                        <td>{{p.y | number:'1.0-2'}}</td>
                        <td>{{p.r}}</td>
                        <td>{{p.hit ? 'ПОПАДАНИЕ' : 'ПРОМАХ'}}</td>
                        <td>
                            <p-button icon="pi pi-file" styleClass="p-button-rounded p-button-text p-button-secondary" 
                                      (onClick)="showProof(p)"
                                      *ngIf="p.proof"></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<p-dialog 
    header="ПРОТОКОЛ ВЕРИФИКАЦИИ" 
    [(visible)]="displayProof" 
    [modal]="false" 
    [draggable]="true" 
    [resizable]="false" 
    position="right"
    [style]="{width: '450px', minWidth: '300px'}"
    [baseZIndex]="10000">

    <div *ngIf="selectedPoint" style="font-family: 'Courier New', monospace;">
        
        <div class="z3-status" [ngClass]="{'status-ok': selectedPoint.smtVerified, 'status-warn': !selectedPoint.smtVerified}">
            <h3>СТАТУС Z3: {{ selectedPoint.smtVerified ? 'ПОДТВЕРЖДЕНО' : 'РАСХОЖДЕНИЕ' }}</h3>
        </div>

        <p-table [value]="selectedPoint.proof" styleClass="p-datatable-gridlines p-datatable-sm">
            <ng-template pTemplate="header">
                <tr>
                    <th>Тип</th>
                    <th>Выражение</th>
                    <th>Результат</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-step>
                <tr (mouseenter)="onStepHover(step)" (mouseleave)="onStepLeave()" style="cursor: crosshair; transition: background-color 0.2s;">
                    <td><small>{{step.type}}</small></td>
                    <td style="word-break: break-all;"><small>{{step.expression}}</small></td>
                    <td><small>{{step.result}}</small></td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</p-dialog>
