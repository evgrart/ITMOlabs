<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Основное приложение</title>
    <h:outputStylesheet name="css/styles.css" />
</h:head>
<h:body>
    <video id="background" class="background" autoplay="true" muted="true" loop="true">
        <source src="images/background.mp4" type="video/mp4" />
    </video>

    <h:form>
        <h:button value="НАЗАД" outcome="to_start" styleClass="backbutton" />
    </h:form>

    <div class="form-and-errors-container">
        <h:form id="mainForm">
            <div class="oreshnik">
                <h2>ОРЕШНИК</h2>
                <div class="form-group">
                    <label><p>X:</p></label>
                    <div class="radio-group">
                        <h:selectOneRadio id="x-radio" value="#{areaCheckBean.x}" layout="pageDirection">
                            <f:selectItem itemValue="-2" itemLabel="-2" />
                            <f:selectItem itemValue="-1.5" itemLabel="-1.5" />
                            <f:selectItem itemValue="-1" itemLabel="-1" />
                            <f:selectItem itemValue="-0.5" itemLabel="-0.5" />
                            <f:selectItem itemValue="0" itemLabel="0" />
                            <f:selectItem itemValue="0.5" itemLabel="0.5" />
                            <f:selectItem itemValue="1" itemLabel="1" />
                            <f:selectItem itemValue="1.5" itemLabel="1.5" />
                            <f:selectItem itemValue="2" itemLabel="2" />
                        </h:selectOneRadio>
                    </div>
                </div>
                <div class="form-group">
                    <h:outputLabel for="y-input"><p>Y:</p></h:outputLabel>
                    <h:inputText id="y-input" value="#{areaCheckBean.y}" required="true" styleClass="input">
                        <f:validateDoubleRange minimum="-3" maximum="3" />
                    </h:inputText>
                    <h:message for="y-input" style="color: red; margin-left: 10px;" />
                </div>
                <div class="form-group">
                    <h:outputLabel for="r-menu"><p>R:</p></h:outputLabel>
                    <h:selectOneMenu id="r-menu" value="#{areaCheckBean.r}" styleClass="input" onchange="onRChange(this.value);">
                        <f:selectItem itemValue="1" itemLabel="1" />
                        <f:selectItem itemValue="1.5" itemLabel="1.5" />
                        <f:selectItem itemValue="2" itemLabel="2" />
                        <f:selectItem itemValue="2.5" itemLabel="2.5" />
                        <f:selectItem itemValue="3" itemLabel="3" />
                    </h:selectOneMenu>
                </div>
                <h:commandButton value="ЭКСТЕРМИНАТУС" action="#{areaCheckBean.check}" styleClass="exterminatus">
                    <f:ajax execute="@form" render=":ajax-update-area" onevent="function(data){ if (data.status === 'success') { updateCanvas(); } }" />
                </h:commandButton>
            </div>

            <p:remoteCommand name="sendCanvasClick"
                             actionListener="#{areaCheckBean.checkFromCanvas}"
                             update="ajax-update-area"
                             oncomplete="updateCanvas();"/>
        </h:form>

        <table class="errors">
            <thead><tr><th>Ошибка</th><th>Время</th></tr></thead>
            <tbody id="errors-body"></tbody>
        </table>
    </div>

    <h:panelGroup id="ajax-update-area" layout="block">
        <h:panelGroup id="resultsWrapper" layout="block" styleClass="results-container">
            <table class="results">
                <thead>
                    <tr>
                        <th class="X">X</th> <th class="Y">Y</th> <th class="R">R</th>
                        <th class="res">Результат</th> <th class="time">Время</th>
                    </tr>
                </thead>
                <tbody>
                    <ui:repeat value="#{areaCheckBean.results}" var="res">
                        <tr>
                            <td><h:outputText value="#{res.x}" /></td>
                            <td><h:outputText value="#{res.y}" /></td>
                            <td><h:outputText value="#{res.r}" /></td>
                            <td><h:outputText value="#{res.hit ? 'Попадание' : 'Промах'}" /></td>
                            <td><h:outputText value="#{res.formattedRequestTime}" /></td>
                        </tr>
                    </ui:repeat>
                </tbody>
            </table>
        </h:panelGroup>

        <h:panelGroup id="json-script-container" layout="block">
            <script type="text/javascript">
                var resultsJsonString = '#{areaCheckBean.resultsAsJson}';
            </script>
        </h:panelGroup>
    </h:panelGroup>

    <canvas id="canvas" class="canvas" width="400" height="400"></canvas>

    <h:outputScript name="js/scripts.js" />
</h:body>
</html>
