name: "assert reverse_bits(1) == -2147483648"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [1]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      T A S B {T:hex} {S:hex} {A:hex} {B:hex} R {R}
      {pc}:	{instruction}	{pc:label}
  - name: Check results
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [-2147483648]
