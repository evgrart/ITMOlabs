  <text x="1250" y="609" class="block-sub">SHL · SHR · AND · OR · XOR · NOT</text>
  <text x="1250" y="638" class="block-sub">result · V_new · C_new</text>

  <polygon points="1500,550 1540,500 1660,500 1660,600 1540,600" class="block"/>
