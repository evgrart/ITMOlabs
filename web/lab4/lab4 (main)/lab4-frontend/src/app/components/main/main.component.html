<div class="main-wrapper">
    <div class="header">
        <h2 style="color: white; margin: 0;">СИСТЕМА НАВЕДЕНИЯ</h2>
        <p-button label="ПОКИНУТЬ ПОСТ" icon="pi pi-sign-out" (onClick)="logout()"></p-button>
    </div>

    <div class="content-container">
        <p-card styleClass="control-panel">
            <div class="form-grid">
                <div class="field">
                    <label>Координата X</label>
                    <p-listbox [options]="xOptions" [(ngModel)]="point.x" [style]="{'width':'100%'}"></p-listbox>
                </div>

                <div class="field">
                    <label>Радиус R</label>
                    <p-listbox [options]="rOptions" [(ngModel)]="point.r" [style]="{'width':'100%'}"></p-listbox>
                </div>

                <div class="field" style="grid-column: span 2;">
                    <label>Координата Y (-3 ... 3)</label>
                    <input type="text" pInputText [(ngModel)]="point.y" style="width: 100%; text-align: center;">
                </div>

                <div class="field" style="grid-column: span 2;">
                    <p-button label="ОГОНЬ" icon="pi pi-crosshairs" [style]="{'width':'100%'}" (onClick)="submitPoint()"></p-button>
                </div>
            </div>
        </p-card>

        <div class="graph-container">
            <app-graph [r]="point.r" [points]="history" (mapClick)="onMapClick($event)"></app-graph>
        </div>

        <div class="table-container">
            <p-table [value]="history" [scrollable]="true" scrollHeight="400px" styleClass="p-datatable-sm">
                <ng-template pTemplate="header">
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                        <th>Время</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-p>
                    <tr [ngClass]="{'row-hit': p.hit, 'row-miss': !p.hit}">
                        <td>{{p.x | number:'1.0-2'}}</td>
                        <td>{{p.y | number:'1.0-2'}}</td>
                        <td>{{p.r}}</td>
                        <td>{{p.hit ? 'ПОПАДАНИЕ' : 'ПРОМАХ'}}</td>
                        
                        <td>{{p.formattedTime}}</td>
                        
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
